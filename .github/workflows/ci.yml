name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: python3 -m pip install ruff==0.17.4

      - run: pnpm format:check

      - run: pnpm lint

      - run: ruff format --check tools/offline_rating/tests

      - run: ruff check tools/offline_rating/tests

      - run: python3 -m unittest discover -s tools/offline_rating/tests -v

      - run: pnpm test

      - run: pnpm typecheck
